# The declarative half of this agent's home -- everything that is a deliberate
# choice for this deployment. Keys equal to the image's own defaults are
# deliberately absent, so the pinned image supplies its current defaults rather
# than a frozen snapshot of them.
# One session per group chat, shared by every participant. Present despite the
# "absent keys mean image defaults" rule above: the image default (true) splits
# a group thread into per-sender sessions, and the plow-chat plugin's
# config.extra flag never reaches the gateway session store.
group_sessions_per_user: false
model:
  default: gpt-5.6-sol
  provider: openai-codex
# The morning brief is the only message this agent sends unprompted, and it is
# written to read like a person texting you. The image wraps every cron
# delivery in "Cronjob Response: <name> (job_id: ...)" and an English footer
# about stopping the reminder, which lands on the owner's phone above a
# Portuguese sentence about their money and announces that a machine is on a
# schedule. Present despite the "absent keys mean image defaults" rule: the
# image default is true.
cron:
  wrap_response: false
mcp_servers:
  # Plow Latch, reached over the Plow relay: the browser and filesystem this
  # agent works on are the operator's Mac, not this container. The relay
  # authorises the connection and tells the Mac who is asking; the Mac
  # authorises each action. Both values come from the agent's own dotenv, so
  # the credential never appears in this file or in a URL in git.
  #
  # OPTIONAL, and `enabled` here is not the last word: scripts/deploy-hook.sh
  # sets it from whether this instance's own .env carries DOMO_DEVICE_UID.
  # Latch is a shortcut, not a dependency -- the agent reads a statement the
  # owner sends as a chat attachment just as well, which is why installing it
  # is offered last and skipped by most people. What the hook prevents is the
  # in-between state: a declared server with no credential is retried on every
  # boot, fails, and parks, so the instance carries a permanently broken
  # connection instead of a feature that is simply off.
  #
  # The block stays in the file either way. `agent-mgr set-latch` refuses an
  # agent whose config declares no latch, so deleting it would close the door
  # on ever adding one.
  latch:
    url: https://api.plow.co/v1/relay/devices/${DOMO_DEVICE_UID}/mcp
    headers:
      Authorization: Bearer ${DOMO_MCP_TOKEN}
    enabled: true
plugins:
  enabled:
  - plow-chat-platform
  entries:
    plow-chat-platform:
      # The plugin registers one platform and no tools. Denying overrides keeps
      # a future plugin change from silently shadowing an image tool of the
      # same name, which would be invisible from this file.
      allow_tool_override: false
platforms:
  plow_chat:
    enabled: true
