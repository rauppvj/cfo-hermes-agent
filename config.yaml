# The declarative half of this agent's home -- everything that is a deliberate
# choice for this deployment. Keys equal to the image's own defaults are
# deliberately absent, so the pinned image supplies its current defaults rather
# than a frozen snapshot of them.
# One session per group chat, shared by every participant. Present despite the
# "absent keys mean image defaults" rule above: the image default (true) splits
# a group thread into per-sender sessions, and the plow-chat plugin's
# config.extra flag never reaches the gateway session store.
group_sessions_per_user: false
model:
  default: gpt-5.6-sol
  provider: openai-codex
# The morning brief is the only message this agent sends unprompted, and it is
# written to read like a person texting you. The image wraps every cron
# delivery in "Cronjob Response: <name> (job_id: ...)" and an English footer
# about stopping the reminder, which lands on the owner's phone above a
# Portuguese sentence about their money and announces that a machine is on a
# schedule. Present despite the "absent keys mean image defaults" rule: the
# image default is true.
cron:
  wrap_response: false
mcp_servers:
  # Plow Latch, reached over the Plow relay: the browser and filesystem this
  # agent works on are the operator's Mac, not this container. The relay
  # authorises the connection and tells the Mac who is asking; the Mac
  # authorises each action. Both values come from the agent's own dotenv, so
  # the credential never appears in this file or in a URL in git.
  #
  # OPTIONAL, and `enabled` here is not the last word: scripts/deploy-hook.sh
  # sets it from whether this instance's own .env carries DOMO_DEVICE_UID.
  # Latch is a shortcut, not a dependency -- the agent reads a statement the
  # owner sends as a chat attachment just as well, which is why installing it
  # is offered last and skipped by most people. What the hook prevents is the
  # in-between state: a declared server with no credential is retried on every
  # boot, fails, and parks, so the instance carries a permanently broken
  # connection instead of a feature that is simply off.
  #
  # The block stays in the file either way. `agent-mgr set-latch` refuses an
  # agent whose config declares no latch, so deleting it would close the door
  # on ever adding one.
  latch:
    url: https://api.plow.co/v1/relay/devices/${DOMO_DEVICE_UID}/mcp
    headers:
      Authorization: Bearer ${DOMO_MCP_TOKEN}
    enabled: true
plugins:
  enabled:
  - plow-chat-platform
  entries:
    plow-chat-platform:
      # The plugin registers one platform and no tools. Denying overrides keeps
      # a future plugin change from silently shadowing an image tool of the
      # same name, which would be invisible from this file.
      allow_tool_override: false
platforms:
  plow_chat:
    enabled: true

# --------------------------------------------------------------------------
# Context, bounded -- which for this agent is a correctness setting
# --------------------------------------------------------------------------
# On 2026-09-10 two card taps reached this instance, at 18:24 and 21:40.
# Neither was recorded. The first got a reply ninety-one minutes later that
# loaded a skill and then stopped; the second got no turn at all. Both were
# logged at 22:18 by the evening brief -- a different job, in a different
# session. The gateway was up, the container was healthy, and nothing said a
# message had been dropped. The log:
#
#     Codex stream produced no SSE events for 5443s after first byte
#     (threshold 180s, model=gpt-5.6-sol, context=~173,010 tokens)
#
# This DM had been open since 2026-08-31: twelve days, 342 messages, 730KB in
# the store -- 320KB of content, 51KB of tool calls, and 329KB of the
# provider's own reasoning items, replayed on every turn. At ~175,000 tokens
# the provider sent a first byte and then nothing for as long as the
# connection stayed open.
#
# Three defaults, each defensible alone, add up to that:
#   * session_reset.mode is `none` since July 2026 -- people expect a
#     conversation to persist -- so nothing ever rotates;
#   * compression.threshold is a RATIO of the window, and the Codex autoraise
#     lifts it further for the 272K family, so full compression waits for
#     ~218,000 tokens, past where this provider goes quiet;
#   * compression.proactive_prune_tokens is 0, so old tool results ride in
#     history and are re-sent verbatim, forever.
#
# Present despite the "absent keys mean image defaults" rule above, and this
# is the clearest case for that rule's exception: the shape of this agent's
# conversation is its own. Short messages, JSON results the owner never sees,
# and **a memory that is not the transcript**. The ledger is the memory --
# nothing said three weeks ago is load-bearing, because it is a row in
# SQLite. That is why this agent can afford a bounded context where a coding
# agent cannot, and why losing a session costs it nothing.
session_reset:
  # Whichever comes first: half a day of silence, or 04:00. Overnight covers
  # it almost every night, without cutting into a conversation in progress.
  mode: both
  at_hour: 4
  idle_minutes: 720
  # A 4am "your session was reset" notification, every day, is how a useful
  # agent gets muted. Nothing is lost that the owner would need to be told
  # about: the ledger is the memory.
  notify: false
compression:
  # Above this, the deterministic no-LLM prune reclaims old tool output --
  # dedup, summarize, truncate. No model call, no quality risk.
  proactive_prune_tokens: 40000
  # An absolute floor under the ratio: compression fires at whichever is
  # lower. A third of this provider's 272K window, and roughly half of where
  # it was measured going quiet. In-place compaction also REBUILDS THE SYSTEM
  # PROMPT, which is the second half of the fix: this session pinned its
  # prompt on 2026-08-31, so twelve days of persona work -- the language rule,
  # the spending-is-not-the-balance rule -- had never reached the running
  # conversation at all.
  threshold_tokens: 90000
